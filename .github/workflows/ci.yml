name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python (uv-managed)
        run: uv python install 3.12
      - run: uv sync --python 3.12 --extra dev --frozen
      - run: uv run ruff check gateway/ tests/
      - run: uv run ruff format --check gateway/ tests/
      - run: uv run mypy gateway/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        storage: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python (uv-managed)
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --extra dev --extra postgres --frozen
      - name: Run unit + integration tests
        env:
          GATEWAY_TEST_STORAGE: ${{ matrix.storage }}
          GATEWAY_TEST_POSTGRES_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway_test
        run: uv run pytest tests/unit/ tests/integration/ -v --cov=gateway --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && matrix.storage == 'postgres'
        with:
          files: ./coverage.xml
