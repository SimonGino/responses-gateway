services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override config.yaml's storage.url so the gateway always reaches the
      # compose postgres service regardless of what the file says (config.yaml
      # may use `localhost` for host-side runs).
      GATEWAY_STORAGE__URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway_dev
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models.yaml:/app/models.yaml:ro
      - gateway_data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
  gateway_data:
