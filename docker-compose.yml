services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override config.yaml's storage.url so the gateway always reaches the
      # compose postgres service regardless of what the file says (config.yaml
      # may use `localhost` for host-side runs). Keep credentials in lockstep
      # with the postgres service via shared POSTGRES_* vars; override
      # GATEWAY_STORAGE_URL directly to point at an external DB.
      GATEWAY_STORAGE__URL: ${GATEWAY_STORAGE_URL:-postgresql+asyncpg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-gateway}@postgres:5432/${POSTGRES_DB:-gateway_dev}}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models.yaml:/app/models.yaml:ro
      - gateway_data:/app/data
    restart: unless-stopped
    healthcheck:
      # Image has no curl; use stdlib urllib. Exit non-zero on any non-2xx.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  gateway_data:
